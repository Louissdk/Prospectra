name: Prospectra CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validar extensão e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências de teste
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verificar sintaxe JavaScript
        run: npm run check

      - name: Executar testes unitários e simulados
        run: npm test

      - name: Validar Manifest V3, arquivos e interface
        run: npm run validate

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Testar migração, grants e RLS em PostgreSQL 17
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/supabase-bootstrap.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/supabase/schema.sql
          # A migração precisa ser reexecutável em projetos já atualizados.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/supabase/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/supabase-rls-integration.sql

      - name: Testar Data API via PostgREST
        env:
          DATABASE_URL: postgresql://authenticator:prospectra-ci-authenticator@127.0.0.1:5432/postgres
          PGRST_JWT_SECRET: prospectra-ci-test-only-secret-32-chars
          POSTGREST_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          docker run --rm -d --name prospectra-postgrest --network host \
            -e PGRST_DB_URI="$DATABASE_URL" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$PGRST_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v16.5
          cleanup() { docker stop prospectra-postgrest >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$POSTGREST_URL/" >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            docker logs prospectra-postgrest
            exit 1
          fi
          node tests/postgrest-integration.mjs

  chromium-e2e:
    name: Captura em Chromium real
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Chromium para testes
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: 148.0.7778.97
          install-dependencies: true

      - name: Instalar dependências
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Executar teste de captura no navegador
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:chromium

  package:
    name: Gerar pacote instalável
    runs-on: ubuntu-latest
    needs: [verify, chromium-e2e]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar pacote limpo
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "package.json ($PACKAGE_VERSION) e manifest.json ($VERSION) precisam ter a mesma versão."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "A tag $GITHUB_REF_NAME não corresponde à versão $VERSION do Manifest."
            exit 1
          fi
          PACKAGE_DIR="dist/extension"
          mkdir -p "$PACKAGE_DIR"
          cp manifest.json sidepanel.html sidepanel.css "$PACKAGE_DIR/"
          cp ./*.js "$PACKAGE_DIR/"
          cp -r icons docs "$PACKAGE_DIR/"
          cp README.md LICENSE.md PRIVACY.md CHANGELOG.md "$PACKAGE_DIR/"
          (cd "$PACKAGE_DIR" && zip -qr "../Prospectra-$VERSION.zip" manifest.json sidepanel.html sidepanel.css *.js icons docs README.md LICENSE.md PRIVACY.md CHANGELOG.md)
          PACKAGE="dist/Prospectra-$VERSION.zip"
          unzip -Z1 "$PACKAGE" | grep -qx 'manifest.json'
          if unzip -Z1 "$PACKAGE" | grep -Eq '(^|/)(tests|node_modules)/'; then
            echo "O pacote contém arquivos de teste ou dependências de desenvolvimento."
            exit 1
          fi
          unzip -p "$PACKAGE" manifest.json > /tmp/prospectra-manifest.json
          node -e "const m=require('/tmp/prospectra-manifest.json'); if(m.manifest_version!==3 || m.version!=='$VERSION') process.exit(1)"
          echo "PROSPECTRA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Pacote pronto: $PACKAGE"

      - name: Publicar artefato instalável
        uses: actions/upload-artifact@v4
        with:
          name: prospectra-extension-package
          path: dist/Prospectra-${{ env.PROSPECTRA_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

  package-smoke:
    name: Instalar ZIP em Chrome limpo
    runs-on: ubuntu-latest
    needs: [package]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: 148.0.7778.97
          install-dependencies: true

      - name: Instalar dependências de teste e Xvfb
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Baixar pacote gerado
        uses: actions/download-artifact@v4
        with:
          name: prospectra-extension-package
          path: dist

      - name: Extrair e instalar ZIP em perfil Chrome limpo
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          EXTENSION_DIR: ${{ github.workspace }}/dist/extension
        run: |
          set -euo pipefail
          mkdir -p "$EXTENSION_DIR"
          PACKAGE="$(find dist -maxdepth 1 -type f -name 'Prospectra-*.zip' -print -quit)"
          if [[ -z "$PACKAGE" ]]; then
            echo "Nenhum pacote Prospectra-*.zip foi encontrado no artefato."
            exit 1
          fi
          unzip -q "$PACKAGE" -d "$EXTENSION_DIR"
          test -f "$EXTENSION_DIR/manifest.json"
          xvfb-run -a node --test tests/chromium/extension-package-smoke.test.mjs

  release:
    name: Publicar GitHub Release
    runs-on: ubuntu-latest
    needs: [package, package-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar pacote instalável
        uses: actions/download-artifact@v4
        with:
          name: prospectra-extension-package
          path: dist

      - name: Criar ou atualizar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Prospectra-*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Prospectra-*.zip \
              --title "Prospectra $GITHUB_REF_NAME" \
              --notes-file CHANGELOG.md
          fi
