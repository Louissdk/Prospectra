name: Prospectra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Validar extensão e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências de teste
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verificar sintaxe JavaScript
        run: npm run check

      - name: Executar testes unitários e simulados
        run: npm test

      - name: Validar Manifest V3, arquivos e interface
        run: npm run validate
